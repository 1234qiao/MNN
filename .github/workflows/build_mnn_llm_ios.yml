# .github/workflows/build_mnn_llm_ios.yml (v16 - The Definitive Fix)

name: Build MNN LLM iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa-from-scratch:
    name: Build MNNLLMChat IPA on macOS 14
    runs-on: macos-14

    steps:
      # 步骤 1: 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # 步骤 2: 编译 MNN.framework
      - name: Build and Place MNN.framework
        run: |
          sh package_scripts/ios/buildiOS.sh "-DMNN_ARM82=true -DMNN_LOW_MEMORY=true -DMNN_SUPPORT_TRANSFORMER_FUSE=true -DMNN_BUILD_LLM=true -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true -DMNN_METAL=ON -DMNN_BUILD_DIFFUSION=ON -DMNN_BUILD_OPENCV=ON -DMNN_IMGCODECS=ON -DMNN_OPENCL=OFF -DMNN_SEP_BUILD=OFF -DMNN_SUPPORT_TRANSFORMER_FUSE=ON"
          mv MNN-iOS-CPU-GPU/Static/MNN.framework apps/iOS/MNNLLMChat/

      # 步骤 3: [终极修复] 使用 Python 脚本对 Xcode 项目文件进行降级
      - name: Downgrade Xcode Project File for Compatibility
        run: |
          PROJECT_FILE="apps/iOS/MNNLLMChat/MNNLLMiOS.xcodeproj/project.pbxproj"
          echo "### Downgrading Xcode project file for Xcode 15 compatibility..."
          
          python3 -c "
          import sys
          import re

          path = '${PROJECT_FILE}'
          with open(path, 'r') as f:
              lines = f.readlines()

          new_lines = []
          skip_block = False
          
          # 定义所有需要降级的版本号
          version_map = {
              'objectVersion = 77;': 'objectVersion = 56;',
              'LastUpgradeCheck = 1620;': 'LastUpgradeCheck = 1540;',
              'LastSwiftUpdateCheck = 1620;': 'LastSwiftUpdateCheck = 1540;',
              'CreatedOnToolsVersion = 16.2;': 'CreatedOnToolsVersion = 15.4;',
          }

          for line in lines:
              # 如果在一个要跳过的块里，就继续跳过直到块结束
              if skip_block:
                  if ');' in line:
                      skip_block = False
                  continue

              # 检查是否是我们要删除的块的开始
              if 'exceptions = (' in line.strip() or 'fileSystemSynchronizedGroups = (' in line.strip():
                  if ');' not in line: # 如果不是单行块
                      skip_block = True
                  continue

              # 替换版本号
              for old, new in version_map.items():
                  if old in line:
                      line = line.replace(old, new)
                      break
              
              # 替换 isa 类型
              line = line.replace('isa = PBXFileSystemSynchronizedRootGroup;', 'isa = PBXGroup;')
              # 替换部署目标版本
              line = re.sub(r'(IPHONEOS_DEPLOYMENT_TARGET = )1[7-9][.0-9]*;', r'\g<1>16.0;', line)

              new_lines.append(line)

          with open(path, 'w') as f:
              f.writelines(new_lines)

          print('### Project file successfully downgraded.')
          "
      
      # 步骤 4: 构建并导出 IPA (现在使用降级后的项目文件)
      - name: Build and Export unsigned IPA
        run: |
          cd apps/iOS/MNNLLMChat
          xcodebuild archive \
            -project MNNLLMiOS.xcodeproj \
            -scheme MNNLLMiOS \
            -destination "generic/platform=iOS" \
            -archivePath build/MNNLLMChat.xcarchive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

          xcodebuild -exportArchive \
            -archivePath build/MNNLLMChat.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist <(echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>method</key><string>development</string></dict></plist>')

      # 步骤 5: 上传最终产物
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNNLLMChat-iOS-unsigned-IPA
          path: apps/iOS/MNNLLMChat/build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
