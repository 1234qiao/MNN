# .github/workflows/build_mnn_llm_ios.yml (v18 - The Workspace Fix)

name: Build MNN LLM iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa-from-scratch:
    name: Build IPA with xcodegen (Workspace Fix)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build and Place MNN.framework
        run: |
          sh package_scripts/ios/buildiOS.sh "-DMNN_ARM82=true -DMNN_LOW_MEMORY=true -DMNN_SUPPORT_TRANSFORMER_FUSE=true -DMNN_BUILD_LLM=true -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true -DMNN_METAL=ON -DMNN_BUILD_DIFFUSION=ON -DMNN_BUILD_OPENCV=ON -DMNN_IMGCODECS=ON -DMNN_OPENCL=OFF -DMNN_SEP_BUILD=OFF -DMNN_SUPPORT_TRANSFORMER_FUSE=ON"
          mv MNN-iOS-CPU-GPU/Static/MNN.framework apps/iOS/MNNLLMChat/

      - name: Regenerate Xcode Project and Workspace
        run: |
          echo "### Installing xcodegen..."
          brew install xcodegen
          
          APP_DIR="apps/iOS/MNNLLMChat"

          echo "### Deleting old project and workspace to ensure a clean slate..."
          # 关键修正 1: 同时删除 xcodeproj 和 xcworkspace
          rm -rf "${APP_DIR}/MNNLLMiOS.xcodeproj"
          rm -rf "${APP_DIR}/MNNLLMiOS.xcworkspace"
          
          echo "### Creating project.yml file..."
          # project.yml 内容保持不变
          cat > "${APP_DIR}/project.yml" <<EOL
          name: MNNLLMiOS
          options:
            bundleIdPrefix: com.yourcompany
          targets:
            MNNLLMiOS:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources: [MNNLLMiOS/]
              info:
                path: MNNLLMiOS/Info.plist
              settings:
                base:
                  SWIFT_VERSION: "5.0"
                  DEVELOPMENT_TEAM: "YOUR_TEAM_ID" # 如果不需要签名，这只是个占位符
              dependencies:
                - framework: MNN.framework
                - package: SQLite.swift
                - package: ExyteChat
                - package: Transformers
          packages:
            SQLite.swift:
              url: https://github.com/stephencelis/SQLite.swift
              from: 0.15.3
            ExyteChat:
              url: https://github.com/Yogayu/Chat.git
              branch: main
            Transformers:
              url: https://github.com/huggingface/swift-transformers/
              from: 0.1.22
          EOL
          
          echo "### Generating new Xcode project and workspace..."
          cd "${APP_DIR}"
          xcodegen generate
          
          echo "### Generation finished. Final contents:"
          ls -laR .

      - name: Build and Export unsigned IPA
        run: |
          cd apps/iOS/MNNLLMChat

          echo "### Listing available schemes from the new workspace..."
          xcodebuild -list -workspace MNNLLMiOS.xcworkspace

          echo "### Archiving the newly generated workspace..."
          # 关键修正 2: 使用 -workspace 而不是 -project
          xcodebuild archive \
            -workspace MNNLLMiOS.xcworkspace \
            -scheme MNNLLMiOS \
            -destination "generic/platform=iOS" \
            -archivePath build/MNNLLMChat.xcarchive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

          echo "### Creating ExportOptions.plist for unsigned IPA..."
          # 关键修正 3: 添加导出 IPA 的步骤
          EXPORT_PLIST_PATH="build/ExportOptions.plist"
          echo "<?xml version=\"1.0\" encoding=\"UTF-8\"?>
          <!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">
          <plist version=\"1.0\">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict/>
          </dict>
          </plist>" > "${EXPORT_PLIST_PATH}"

          echo "### Exporting the archive to an IPA..."
          xcodebuild -exportArchive \
            -archivePath build/MNNLLMChat.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist "${EXPORT_PLIST_PATH}"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNNLLMChat-iOS-unsigned-IPA
          # 关键修正 4: 更新路径以匹配 exportArchive 的输出
          path: apps/iOS/MNNLLMChat/build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7```
