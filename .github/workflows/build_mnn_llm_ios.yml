# .github/workflows/build_mnn_llm_ios.yml (v17 - Forensic Debugging)

name: Build MNN LLM iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa-from-scratch:
    name: Build IPA with xcodegen (Forensic Mode)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build and Place MNN.framework
        run: |
          sh package_scripts/ios/buildiOS.sh "-DMNN_ARM82=true -DMNN_LOW_MEMORY=true -DMNN_SUPPORT_TRANSFORMER_FUSE=true -DMNN_BUILD_LLM=true -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true -DMNN_METAL=ON -DMNN_BUILD_DIFFUSION=ON -DMNN_BUILD_OPENCV=ON -DMNN_IMGCODECS=ON -DMNN_OPENCL=OFF -DMNN_SEP_BUILD=OFF -DMNN_SUPPORT_TRANSFORMER_FUSE=ON"
          mv MNN-iOS-CPU-GPU/Static/MNN.framework apps/iOS/MNNLLMChat/

      # 步骤 3: [终极调试] 详细记录 xcodegen 的每一步
      - name: Regenerate Xcode Project with Detailed Logging
        run: |
          echo "### 1. Starting project regeneration step. Current directory:"
          pwd
          
          echo "### 2. Installing xcodegen..."
          brew install xcodegen
          
          APP_DIR="apps/iOS/MNNLLMChat"

          echo "### 3. Listing contents of '${APP_DIR}' BEFORE deletion:"
          ls -laR "${APP_DIR}"
          
          echo "### 4. Deleting old project directory: ${APP_DIR}/MNNLLMiOS.xcodeproj"
          rm -rf "${APP_DIR}/MNNLLMiOS.xcodeproj"
          
          echo "### 5. Listing contents of '${APP_DIR}' AFTER deletion:"
          ls -laR "${APP_DIR}"
          
          echo "### 6. Creating project.yml file..."
          cat > "${APP_DIR}/project.yml" <<EOL
          name: MNNLLMiOS
          options:
            bundleIdPrefix: com.yourcompany
          targets:
            MNNLLMiOS:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources: [MNNLLMiOS/]
              info:
                path: MNNLLMiOS/Info.plist
              settings:
                base:
                  SWIFT_VERSION: "5.0"
                  DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
              dependencies:
                - framework: MNN.framework
                - package: SQLite.swift
                - package: ExyteChat
                - package: Transformers
          packages:
            SQLite.swift:
              url: https://github.com/stephencelis/SQLite.swift
              from: 0.15.3
            ExyteChat:
              url: https://github.com/Yogayu/Chat.git
              branch: main
            Transformers:
              url: https://github.com/huggingface/swift-transformers/
              from: 0.1.22
          EOL
          
          echo "### 7. Verifying project.yml creation:"
          ls -l "${APP_DIR}/project.yml"
          
          echo "### 8. Generating new Xcode project from yml..."
          cd "${APP_DIR}"
          xcodegen generate
          
          echo "### 9. Generation finished. Listing FINAL contents of current directory:"
          ls -laR .

      # 后续步骤暂时保持不变
      - name: Build and Export unsigned IPA
        run: |
          cd apps/iOS/MNNLLMChat
          echo "### Archiving the newly generated project..."
          xcodebuild archive \
            -project MNNLLMiOS.xcodeproj \
            -scheme MNNLLMiOS \
            -destination "generic/platform=iOS" \
            -archivePath build/MNNLLMChat.xcarchive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNNLLMChat-iOS-unsigned-IPA
          path: apps/iOS/MNNLLMChat/build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
