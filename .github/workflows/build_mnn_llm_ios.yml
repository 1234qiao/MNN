# .github/workflows/build_mnn_llm_ios.yml (v17 - The Final Polish)

name: Build MNN LLM iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa-from-scratch:
    name: Build IPA with xcodegen
    runs-on: macos-14

    steps:
      # 步骤 1: 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # 步骤 2: 编译 MNN.framework
      - name: Build and Place MNN.framework
        run: |
          sh package_scripts/ios/buildiOS.sh "-DMNN_ARM82=true -DMNN_LOW_MEMORY=true -DMNN_SUPPORT_TRANSFORMER_FUSE=true -DMNN_BUILD_LLM=true -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true -DMNN_METAL=ON -DMNN_BUILD_DIFFUSION=ON -DMNN_BUILD_OPENCV=ON -DMNN_IMGCODECS=ON -DMNN_OPENCL=OFF -DMNN_SEP_BUILD=OFF -DMNN_SUPPORT_TRANSFORMER_FUSE=ON"
          mv MNN-iOS-CPU-GPU/Static/MNN.framework apps/iOS/MNNLLMChat/

      # 步骤 3: 使用 xcodegen 重新生成项目文件 (增强版)
      - name: Generate compatible Xcode project
        run: |
          echo "### Installing xcodegen..."
          brew install xcodegen
          
          APP_DIR="apps/iOS/MNNLLMChat"

          echo "### Removing old, incompatible .xcodeproj..."
          rm -rf "${APP_DIR}/MNNLLMiOS.xcodeproj"
          
          # [关键修复] 创建一个更详细的 project.yml 配置文件
          cat > "${APP_DIR}/project.yml" <<EOL
          name: MNNLLMiOS
          options:
            bundleIdPrefix: com.yourcompany
          targets:
            MNNLLMiOS:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources: [MNNLLMiOS/]
              info:
                path: MNNLLMiOS/Info.plist
              settings:
                base:
                  SWIFT_VERSION: "5.0"
                  DEVELOPMENT_TEAM: "YOUR_TEAM_ID" # 占位符
                  # 明确告诉链接器去哪里找框架
                  FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)"
              dependencies:
                - framework: MNN.framework
                - package: SQLite.swift
                - package: ExyteChat
                - package: Transformers
                # [关键修复] 添加 SwiftUI App 所需的系统框架
                - sdk: UIKit.framework
                - sdk: SwiftUI.framework
                - sdk: Foundation.framework
                - sdk: AVFoundation.framework
                - sdk: CoreAudioTypes.framework
          packages:
            SQLite.swift:
              url: https://github.com/stephencelis/SQLite.swift
              from: 0.15.3
            ExyteChat:
              url: https://github.com/Yogayu/Chat.git
              branch: main
            Transformers:
              url: https://github.com/huggingface/swift-transformers/
              from: 0.1.22
          EOL

          echo "### Generating new Xcode project..."
          cd "${APP_DIR}"
          xcodegen generate

      # 步骤 4: 构建并导出 IPA
      - name: Build and Export unsigned IPA
        run: |
          cd apps/iOS/MNNLLMChat
          xcodebuild archive \
            -project MNNLLMiOS.xcodeproj \
            -scheme MNNLLMiOS \
            -destination "generic/platform=iOS" \
            -archivePath build/MNNLLMChat.xcarchive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

          xcodebuild -exportArchive \
            -archivePath build/MNNLLMChat.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist <(echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>method</key><string>development</string></dict></plist>')

      # 步骤 5: 上传最终产物
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNNLLMChat-iOS-unsigned-IPA
          path: apps/iOS/MNNLLMChat/build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
