# .github/workflows/build_mnn_llm_ios.yml (v26-PlanA)

name: Build MNN LLM iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa-on-latest:
    name: Build IPA on macos-latest with SDK Fix
    runs-on: macos-latest # 使用 Xcode 16

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build and Place MNN.framework
        run: |
          sh package_scripts/ios/buildiOS.sh "-DMNN_ARM82=true -DMNN_LOW_MEMORY=true -DMNN_SUPPORT_TRANSFORMER_FUSE=true -DMNN_BUILD_LLM=true -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true -DMNN_METAL=ON -DMNN_BUILD_DIFFUSION=ON -DMNN_BUILD_OPENCV=ON -DMNN_IMGCODECS=ON -DMNN_OPENCL=OFF -DMNN_SEP_BUILD=OFF -DMNN_SUPPORT_TRANSFORMER_FUSE=ON"
          mv MNN-iOS-CPU-GPU/Static/MNN.framework apps/iOS/MNNLLMChat/

      - name: Build and Export unsigned IPA
        run: |
          cd apps/iOS/MNNLLMChat

          # 关键修正：添加 -sdk iphoneos 来解决 "iOS 18.0 not installed" 的问题
          xcodebuild archive \
            -project MNNLLMiOS.xcodeproj \
            -scheme MNNLLMiOS \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/MNNLLMChat.xcarchive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

          # ... [导出 IPA 的部分保持不变] ...
          EXPORT_PLIST_PATH="build/ExportOptions.plist"
          cat > "${EXPORT_PLIST_PATH}" <<EOL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict/>
          </dict>
          </plist>
          EOL
          
          xcodebuild -exportArchive \
            -archivePath build/MNNLLMChat.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist "${EXPORT_PLIST_PATH}"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNNLLMChat-iOS-unsigned-IPA
          path: apps/iOS/MNNLLMChat/build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
