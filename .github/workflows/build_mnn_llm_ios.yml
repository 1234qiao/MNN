# .github/workflows/build_mnn_llm_ios.yml (v19 - The Corrected Final Version)

name: Build MNN LLM iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa-from-scratch:
    name: Build IPA with xcodegen (Correct Pathing & Logic)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build and Place MNN.framework
        run: |
          sh package_scripts/ios/buildiOS.sh "-DMNN_ARM82=true -DMNN_LOW_MEMORY=true -DMNN_SUPPORT_TRANSFORMER_FUSE=true -DMNN_BUILD_LLM=true -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true -DMNN_METAL=ON -DMNN_BUILD_DIFFUSION=ON -DMNN_BUILD_OPENCV=ON -DMNN_IMGCODECS=ON -DMNN_OPENCL=OFF -DMNN_SEP_BUILD=OFF -DMNN_SUPPORT_TRANSFORMER_FUSE=ON"
          mv MNN-iOS-CPU-GPU/Static/MNN.framework apps/iOS/MNNLLMChat/

      - name: Regenerate Xcode Project
        run: |
          echo "### Installing xcodegen..."
          brew install xcodegen
          
          APP_DIR="apps/iOS/MNNLLMChat"

          echo "### Deleting old project directory to ensure a clean slate..."
          # 关键点 1: 这个删除是正确的，它移除了整个 .xcodeproj 包，包括内部被污染的 workspace。
          rm -rf "${APP_DIR}/MNNLLMiOS.xcodeproj"
          
          echo "### Creating project.yml file..."
          cat > "${APP_DIR}/project.yml" <<EOL
          name: MNNLLMiOS
          options:
            bundleIdPrefix: com.yourcompany
          targets:
            MNNLLMiOS:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources: [MNNLLMiOS/]
              info:
                path: MNNLLMiOS/Info.plist
              settings:
                base:
                  SWIFT_VERSION: "5.0"
                  DEVELOPMENT_TEAM: "YOUR_TEAM_ID" # This will be ignored due to CODE_SIGNING_ALLOWED=NO
              dependencies:
                - framework: MNN.framework
                - package: SQLite.swift
                - package: ExyteChat
                - package: Transformers
          packages:
            SQLite.swift:
              url: https://github.com/stephencelis/SQLite.swift
              from: 0.15.3
            ExyteChat:
              url: https://github.com/Yogayu/Chat.git
              branch: main
            Transformers:
              url: https://github.com/huggingface/swift-transformers/
              from: 0.1.22
          EOL
          
          echo "### Generating new Xcode project from yml..."
          cd "${APP_DIR}"
          xcodegen generate

      - name: Build and Export unsigned IPA
        run: |
          cd apps/iOS/MNNLLMChat

          echo "### Archiving the newly generated project..."
          # 关键点 2: 恢复使用 -project。因为项目是全新的，Xcode 15 可以正确处理其内部嵌套的 workspace 和 SPM 包。
          xcodebuild archive \
            -project MNNLLMiOS.xcodeproj \
            -scheme MNNLLMiOS \
            -destination "generic/platform=iOS" \
            -archivePath build/MNNLLMChat.xcarchive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

          echo "### Creating ExportOptions.plist for unsigned IPA..."
          # 关键点 3: 添加导出 IPA 所需的配置文件。
          EXPORT_PLIST_PATH="build/ExportOptions.plist"
          cat > "${EXPORT_PLIST_PATH}" <<EOL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict/>
              <key>teamID</key>
              <string>YOUR_TEAM_ID</string>
              <key>signingCertificate</key>
              <string></string>
          </dict>
          </plist>
          EOL
          
          echo "### Exporting the archive to an IPA..."
          xcodebuild -exportArchive \
            -archivePath build/MNNLLMChat.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist "${EXPORT_PLIST_PATH}"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNNLLMChat-iOS-unsigned-IPA
          path: apps/iOS/MNNLLMChat/build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
