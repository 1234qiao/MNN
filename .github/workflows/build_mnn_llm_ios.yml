# .github/workflows/build_mnn_llm_ios.yml (v14 - Final Solution: xcodegen)

name: Build MNN LLM iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa-from-scratch:
    name: Build IPA with xcodegen
    # 关键 1: 锁定在稳定、可靠的 macos-14 (Xcode 15) 环境
    runs-on: macos-14

    steps:
      # 步骤 1: 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # 步骤 2: 编译 MNN.framework (这一步没有变)
      - name: Build and Place MNN.framework
        run: |
          echo "### Building MNN.framework with LLM support..."
          sh package_scripts/ios/buildiOS.sh "-DMNN_ARM82=true -DMNN_LOW_MEMORY=true -DMNN_SUPPORT_TRANSFORMER_FUSE=true -DMNN_BUILD_LLM=true -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true -DMNN_METAL=ON -DMNN_BUILD_DIFFUSION=ON -DMNN_BUILD_OPENCV=ON -DMNN_IMGCODECS=ON -DMNN_OPENCL=OFF -DMNN_SEP_BUILD=OFF -DMNN_SUPPORT_TRANSFORMER_FUSE=ON"
          
          echo "### Moving framework into App project..."
          mv MNN-iOS-CPU-GPU/Static/MNN.framework apps/iOS/MNNLLMChat/

      # 步骤 3: [终极修复] 使用 xcodegen 重新生成项目文件
      - name: Generate compatible Xcode project
        run: |
          echo "### Installing xcodegen..."
          brew install xcodegen
          
          # 定义一个 project.yml 配置文件，这是 xcodegen 的蓝图
          # 这个配置是根据您仓库的结构和依赖关系精心编写的
          cat > apps/iOS/MNNLLMChat/project.yml <<EOL
          name: MNNLLMiOS
          options:
            bundleIdPrefix: com.yourcompany # 这个不重要，Sideloadly会覆盖
          targets:
            MNNLLMiOS:
              type: application
              platform: iOS
              deploymentTarget: "16.0" # 确保版本兼容
              sources: [MNNLLMiOS/] # App 的所有源文件
              info:
                path: MNNLLMiOS/Info.plist # 指向现有的Info.plist
              settings:
                base:
                  SWIFT_VERSION: "5.0"
                  DEVELOPMENT_TEAM: "YOUR_TEAM_ID" # 占位符
              dependencies:
                - framework: MNN.framework
                - package: SQLite.swift
                - package: ExyteChat
                - package: Transformers
          packages:
            SQLite.swift:
              url: https://github.com/stephencelis/SQLite.swift
              from: 0.15.3
            ExyteChat:
              url: https://github.com/Yogayu/Chat.git
              branch: main
            Transformers:
              url: https://github.com/huggingface/swift-transformers/
              from: 0.1.22
          EOL

          echo "### Generating new Xcode project..."
          cd apps/iOS/MNNLLMChat
          # 运行 xcodegen, 它会读取 project.yml 并生成一个全新的、干净的 .xcodeproj
          xcodegen generate

      # 步骤 4: 构建并导出 IPA (现在使用新生成的项目文件)
      - name: Build and Export unsigned IPA
        run: |
          cd apps/iOS/MNNLLMChat
          echo "### Archiving the newly generated project..."
          xcodebuild archive \
            -project MNNLLMiOS.xcodeproj \
            -scheme MNNLLMiOS \
            -destination "generic/platform=iOS" \
            -archivePath build/MNNLLMChat.xcarchive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

          echo "### Exporting the archive to an IPA..."
          xcodebuild -exportArchive \
            -archivePath build/MNNLLMChat.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist <(echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>method</key><string>development</string></dict></plist>')

      # 步骤 5: 上传最终产物
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNNLLMChat-iOS-unsigned-IPA
          path: apps/iOS/MNNLLMChat/build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
